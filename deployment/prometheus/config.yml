global:
  scrape_interval: 10s
scrape_configs:
  - job_name: 'temporalmetrics'
    metrics_path: /metrics
    scheme: http
    static_configs:
      # Server metrics targets, one per cluster
      - targets:
          - 'host.docker.internal:8002'
        labels:
          group: 'server-metrics'
          cluster: 'cluster-a'

      - targets:
          - 'host.docker.internal:8003'
        labels:
          group: 'server-metrics'
          cluster: 'cluster-b'

      # Local app targets (if configured)
      - targets:
          - 'host.docker.internal:8077'
          - 'host.docker.internal:8078'
        labels:
          group: 'sdk-metrics'
      # Docker metrics
      - targets:
          - 'host.docker.internal:9323'
        labels:
          group: 'docker-metrics'
      # Postgres Exporter
      - targets:
          - 'host.docker.internal:9187'
        labels:
          group: 'postgres-metrics'
  - job_name: 'springbootjavasdk'
    metrics_path: /actuator/prometheus
    scheme: http
    static_configs:
      - targets:
          - 'host.docker.internal:3030'
        labels:
          group: 'spring-boot-metrics'
  # Warden demo workload: Temporal SDK metrics, one endpoint per process.
  # Source: warden-demo-workload/monitoring/prometheus-sdk-scrape.yml
  - job_name: 'warden-demo-sdk'
    metrics_path: /metrics
    scheme: http
    scrape_interval: 30s
    static_configs:
      - targets:
          - 'host.docker.internal:9110'   # dashboard
          - 'host.docker.internal:9111'   # generator
          - 'host.docker.internal:9112'   # order-tq
          - 'host.docker.internal:9113'   # dispatch-tq
          - 'host.docker.internal:9114'   # courier-tq
          - 'host.docker.internal:9115'   # batch-tq
          - 'host.docker.internal:9116'   # settlement-tq
          - 'host.docker.internal:9117'   # menu-tq
          - 'host.docker.internal:9118'   # control-tq
        labels:
          group: 'sdk-metrics'
