services:
  elasticsearch:
    container_name: temporal-elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    image: elasticsearch:${ELASTICSEARCH_VERSION}
    ports:
      - published: 9200
        target: 9200
    networks:
      - temporal-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  postgresql:
    container_name: temporal-postgresql
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    image: postgres:${POSTGRESQL_VERSION}
    expose:
      - ${POSTGRES_DEFAULT_PORT}
    volumes:
      - /var/lib/postgresql/data
    networks:
      - temporal-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  temporal-setup:
    image: temporalio/admin-tools:${TEMPORAL_ADMINTOOLS_VERSION}
    container_name: temporal-setup
    restart: on-failure:6
    depends_on:
      postgresql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=${POSTGRES_DEFAULT_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PWD=${POSTGRES_PASSWORD}
      - POSTGRES_SEEDS=postgresql
      - SQL_PASSWORD=${POSTGRES_PASSWORD}
      - ES_HOST=elasticsearch
      - ES_PORT=9200
      - ES_SCHEME=http
      - ES_VERSION=v7
      - ES_VISIBILITY_INDEX=temporal_visibility_v1_dev
    networks:
      - temporal-network
    volumes:
      - ./scripts:/scripts
    entrypoint: ["/bin/sh"]
    command: /scripts/setup-postgres-es.sh

  temporal:
    container_name: temporal
    depends_on:
      - temporal-setup
    environment:
      # The server image's built-in config template cannot express
      # cross-cluster replication or per-remote-cluster TLS, so this cluster
      # runs from an explicit config file instead. Everything below is read by
      # that file's `{{ env "..." }}` placeholders.
      - TEMPORAL_SERVER_CONFIG_FILE_PATH=/etc/temporal/config/config.yaml
      - CERTS_DIR=/etc/temporal/certs
      - POSTGRES_SEEDS=postgresql
      - DB_PORT=${POSTGRES_DEFAULT_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PWD=${POSTGRES_PASSWORD}
      - ES_SEEDS=elasticsearch
      - ES_PORT=9200
      - ES_SCHEME=http
      - ES_VERSION=v7
      - ES_VIS_INDEX=temporal_visibility_v1_dev
      - DYNAMIC_CONFIG_FILE_PATH=/etc/temporal/config/dynamicconfig/development-sql.yaml
      - PROMETHEUS_ENDPOINT=0.0.0.0:8002
      # Client certificates are the only credential the frontend accepts, so
      # the server needs to be told the missing authorizer is deliberate.
      - TEMPORAL_ALLOW_NO_AUTH=true
      - TEMPORAL_SERVICES=frontend,matching,worker,history,internal-frontend
    image: temporalio/server:${TEMPORAL_VERSION}
    ports:
      - published: 7233
        target: 7233
      - published: 8002
        target: 8002
    restart: on-failure
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig
      - ./config/cluster-a/config.yaml:/etc/temporal/config/config.yaml:ro
      - ./certs:/etc/temporal/certs:ro
    networks:
      - temporal-network

  temporal-create-namespace:
    image: temporalio/admin-tools:${TEMPORAL_ADMINTOOLS_VERSION}
    container_name: temporal-create-namespace
    restart: on-failure:5
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - DEFAULT_NAMESPACE=default
      - TEMPORAL_TLS_CA_PATH=/etc/temporal/certs/ca/ca.pem
      - TEMPORAL_TLS_CERT_PATH=/etc/temporal/certs/cluster-a/client.pem
      - TEMPORAL_TLS_KEY_PATH=/etc/temporal/certs/cluster-a/client.key
      - TEMPORAL_TLS_SERVER_NAME=temporal
    networks:
      - temporal-network
    volumes:
      - ./scripts:/scripts
      - ./certs:/etc/temporal/certs:ro
    entrypoint: ["/bin/sh"]
    command: /scripts/create-namespace.sh

  temporal-admin-tools:
    container_name: temporal-admin-tools
    depends_on:
      - temporal
    environment:
      # The frontend authenticates callers by certificate alone.
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CLI_ADDRESS=temporal:7233
      - TEMPORAL_TLS_CA_PATH=/etc/temporal/certs/ca/ca.pem
      - TEMPORAL_TLS_CERT_PATH=/etc/temporal/certs/cluster-a/client.pem
      - TEMPORAL_TLS_KEY_PATH=/etc/temporal/certs/cluster-a/client.key
      - TEMPORAL_TLS_SERVER_NAME=temporal
    image: temporalio/admin-tools:${TEMPORAL_ADMINTOOLS_VERSION}
    stdin_open: true
    tty: true
    networks:
      - temporal-network
    volumes:
      - ./certs:/etc/temporal/certs:ro
      - ./scripts:/scripts

  temporal-ui:
    container_name: temporal-ui
    depends_on:
      - temporal
    environment:
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
      - TEMPORAL_CSRF_COOKIE_INSECURE=true
      - TEMPORAL_CLI_ADDRESS=temporal:7233
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_AUTH_ENABLED=true
      - TEMPORAL_AUTH_PROVIDER_URL=http://keycloak:9080/realms/temporal
      - TEMPORAL_AUTH_CLIENT_ID=temporal-app
      - TEMPORAL_AUTH_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
      - TEMPORAL_AUTH_CALLBACK_URL=http://localhost:8080/auth/sso/callback
      - TEMPORAL_AUTH_SCOPES=openid,profile,email
      # Client certificate for the mTLS frontend.
      - TEMPORAL_TLS_CA=/etc/temporal/certs/ca/ca.pem
      - TEMPORAL_TLS_CERT=/etc/temporal/certs/cluster-a/client.pem
      - TEMPORAL_TLS_KEY=/etc/temporal/certs/cluster-a/client.key
      - TEMPORAL_TLS_ENABLE_HOST_VERIFICATION=true
      - TEMPORAL_TLS_SERVER_NAME=temporal
    image: temporalio/ui:${TEMPORAL_UI_VERSION}
    ports:
      - 8080:8080
    networks:
      - temporal-network
    volumes:
      - ./certs:/etc/temporal/certs:ro

  prometheus:
    container_name: prometheus
    image: prom/prometheus:v2.37.0
    ports:
      - published: 9090
        target: 9090
    volumes:
      - type: bind
        source: ./deployment/prometheus/config.yml
        target: /etc/prometheus/prometheus.yml
    networks:
      - temporal-network

  grafana:
    container_name: grafana
    image: grafana/grafana:latest
    build: './deployment/grafana'
    environment:
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    ports:
      - published: 8085
        target: 3000
    volumes:
      - type: bind
        source: ./deployment/grafana/provisioning/datasources
        target: /etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - temporal-network

  # Keycloak stores its realms in Postgres but cannot create its own database,
  # so this one-shot service does it first. Creating it here rather than with an
  # init script under /docker-entrypoint-initdb.d means it also works against a
  # Postgres volume that already holds Temporal's data.
  keycloak-db-setup:
    image: postgres:${POSTGRESQL_VERSION}
    container_name: keycloak-db-setup
    restart: on-failure:3
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        if psql -h postgresql -p ${POSTGRES_DEFAULT_PORT} -U ${POSTGRES_USER} -d postgres \
             -tAc "SELECT 1 FROM pg_database WHERE datname = '${KEYCLOAK_DB_NAME}'" | grep -q 1; then
          echo "Database '${KEYCLOAK_DB_NAME}' already exists"
        else
          psql -h postgresql -p ${POSTGRES_DEFAULT_PORT} -U ${POSTGRES_USER} -d postgres \
            -c "CREATE DATABASE ${KEYCLOAK_DB_NAME}"
        fi
    networks:
      - temporal-network

  keycloak:
    container_name: keycloak
    image: keycloak/keycloak:26.7.2
    command: start-dev --http-port 9080
    depends_on:
      keycloak-db-setup:
        condition: service_completed_successfully
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      # Realms, clients and users persist in Postgres, so they survive a
      # container restart. `docker compose down -v` still drops them with the
      # volume.
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgresql:${POSTGRES_DEFAULT_PORT}/${KEYCLOAK_DB_NAME}
      - KC_DB_USERNAME=${POSTGRES_USER}
      - KC_DB_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - 9080:9080
    networks:
      - temporal-network

networks:
  temporal-network:
    driver: bridge
    name: temporal-network
